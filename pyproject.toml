[project]
name = "claudex-gateway"
version = "0.12.0"
description = "Local multi-provider gateway that routes Claude Code requests to Anthropic, Codex, Kimi, Grok, and custom backends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
claudex-gateway = "claudex.__main__:main"

[project.optional-dependencies]
gptpro = [
    "mcp>=2.1.1",
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudex"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
