[project]
name = "claudex-gateway"
version = "0.4.0"
description = "Local gateway that runs Claude Code models on Codex, Kimi, or Grok backends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
claudex-gateway = "claudex_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudex_gateway"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
